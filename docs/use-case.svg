<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="1150" height="560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1150" height="560" fill="#ffffff"/>

  <!-- Ranh giới hệ thống -->
  <rect x="190" y="40" width="795" height="490" rx="10" fill="#F8FAFC" stroke="#5B6B7F" stroke-width="1.5"/>
  <text x="587" y="62" text-anchor="middle" font-weight="bold" font-size="15" fill="#1F2937">Phần mềm chẩn đoán lỗi ô tô</text>

  <!-- Đường nối tác nhân Kỹ thuật viên (trục chung x=170) -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="86" y1="315" x2="170" y2="315"/>
    <line x1="170" y1="90" x2="170" y2="495"/>
    <line x1="170" y1="90"  x2="235" y2="90"/>
    <line x1="170" y1="180" x2="235" y2="180"/>
    <line x1="170" y1="270" x2="235" y2="270"/>
    <line x1="170" y1="360" x2="235" y2="360"/>
    <line x1="170" y1="135" x2="485" y2="135"/>
    <line x1="170" y1="225" x2="485" y2="225"/>
    <line x1="170" y1="315" x2="485" y2="315"/>
    <line x1="170" y1="495" x2="485" y2="495"/>
    <!-- Xe nối UC03 -->
    <line x1="970" y1="360" x2="1050" y2="360"/>
  </g>

  <!-- include / extend -->
  <g stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="6 4">
    <line x1="688" y1="236" x2="830" y2="337" marker-end="url(#open)"/>
    <line x1="695" y1="318" x2="790" y2="358" marker-end="url(#open)"/>
    <line x1="680" y1="482" x2="830" y2="383" marker-end="url(#open)"/>
    <line x1="590" y1="163" x2="590" y2="197" marker-end="url(#open)"/>
    <line x1="330" y1="422" x2="330" y2="388" marker-end="url(#open)"/>
  </g>
  <g font-size="11.5" fill="#475569" font-style="italic" stroke="#F8FAFC" stroke-width="4" paint-order="stroke" text-anchor="middle">
    <text x="748" y="262">«include»</text>
    <text x="752" y="366">«include»</text>
    <text x="735" y="428">«include»</text>
  </g>
  <g font-size="11.5" fill="#475569" font-style="italic" stroke="#F8FAFC" stroke-width="4" paint-order="stroke">
    <text x="600" y="184">«extend»</text>
    <text x="342" y="410">«extend»</text>
  </g>

  <!-- Use-case: cột 1 -->
  <g fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.5">
    <ellipse cx="330" cy="90"  rx="105" ry="28"/>
    <ellipse cx="330" cy="180" rx="105" ry="28"/>
    <ellipse cx="330" cy="270" rx="105" ry="28"/>
    <ellipse cx="330" cy="360" rx="105" ry="28"/>
    <ellipse cx="330" cy="450" rx="105" ry="28"/>
    <!-- cột 2 -->
    <ellipse cx="590" cy="135" rx="105" ry="28"/>
    <ellipse cx="590" cy="225" rx="105" ry="28"/>
    <ellipse cx="590" cy="315" rx="105" ry="28"/>
    <ellipse cx="590" cy="495" rx="105" ry="28"/>
    <!-- cột 3 -->
    <ellipse cx="880" cy="360" rx="90" ry="28"/>
  </g>
  <g fill="#1F2937" text-anchor="middle">
    <text x="330" y="94">UC01 Quản lý hồ sơ xe</text>
    <text x="330" y="184">UC02 Chọn xe cần chẩn đoán</text>
    <text x="330" y="274">UC10 Tra cứu mô tả DTC</text>
    <text x="330" y="364">UC08 Xem lịch sử theo xe</text>
    <text x="330" y="454">UC09 Xuất kết quả</text>
    <text x="590" y="139">UC07 Phân tích nguyên nhân</text>
    <text x="590" y="229">UC05 Đọc mã lỗi (DTC)</text>
    <text x="590" y="319">UC04 Xem dữ liệu sống</text>
    <text x="590" y="499">UC06 Xóa mã lỗi (DTC)</text>
    <text x="880" y="364">UC03 Kết nối với xe</text>
  </g>

  <!-- Tác nhân: Kỹ thuật viên -->
  <g stroke="#1F2937" stroke-width="1.6" fill="none">
    <circle cx="70" cy="292" r="11" fill="#ffffff"/>
    <line x1="70" y1="303" x2="70" y2="333"/>
    <line x1="54" y1="315" x2="86" y2="315"/>
    <line x1="70" y1="333" x2="56" y2="358"/>
    <line x1="70" y1="333" x2="84" y2="358"/>
  </g>
  <text x="70" y="380" text-anchor="middle" font-weight="bold" fill="#1F2937">Kỹ thuật viên</text>

  <!-- Tác nhân: Xe -->
  <g stroke="#1F2937" stroke-width="1.6" fill="none">
    <circle cx="1075" cy="337" r="11" fill="#ffffff"/>
    <line x1="1075" y1="348" x2="1075" y2="378"/>
    <line x1="1059" y1="360" x2="1091" y2="360"/>
    <line x1="1075" y1="378" x2="1061" y2="403"/>
    <line x1="1075" y1="378" x2="1089" y2="403"/>
  </g>
  <text x="1075" y="425" text-anchor="middle" font-weight="bold" fill="#1F2937">Xe (ECU mô phỏng)</text>
</svg>
